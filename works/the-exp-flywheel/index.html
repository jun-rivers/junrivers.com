<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The EXP. Flywheel</title>
<style>
  @import url('https://fonts.googleapis.com/css?family=Inconsolata|Montserrat');


  body {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
  }

  h1,h2,h3,h4,h5 {
    font-family: 'Montserrat', sans-serif;
  }

  h2, h3 {
/*    text-transform: uppercase;*/
    letter-spacing: .2em;
    line-height: 30px;
  }

  .slice {
    cursor: pointer;
  }

  .slice .main-arc {
    stroke: #fff;
    stroke-width: 1px;
  }

  .slice .hidden-arc {
    fill: none;
  }

  /* Actual-vs-target band on the outer edge of each segment */
  .slice .track-arc {
    fill: #fff;
    fill-opacity: .25;
    pointer-events: none;
  }

  .slice .progress-arc {
    fill-opacity: .9;
    pointer-events: none;
  }

  .slice text {
    pointer-events: none;
    dominant-baseline: middle;
    text-anchor: middle;
  }

  /* Everything aligns to the 12-point grid: 2.5vw from each edge */
  #sidebar {
    position: absolute;
    top: 2.5vw;
    left: 2.5vw;
    width: 25%;
    height: calc(100% - 5vw);
    text-align: left;
    line-height: 14px;
    color: #666;
    z-index: -1;
  }

  #title {
    font-size: 2.5em;
  }

  #title {
    margin: 0 0 2px;
    line-height: 1;
  }

  #detail {
    font-size: 12px;
  }

  #detail .id {
    color: #999;
    letter-spacing: .1em;
    margin-bottom: 10px;
  }

  #detail .facts {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 14px;
    row-gap: 5px;
    margin: 0 0 10px;
  }

  #detail dt {
    color: #999;
  }

  #detail dd {
    margin: 0;
    color: #323232;
    font-family: 'Montserrat', sans-serif;
  }

  #detail dd.dri { font-weight: bold; }
  #detail dd.muted { color: #bbb; }
  #detail dd.over { color: #E4572E; }
  #detail dd.ahead { color: #B08A00; }
  #detail dd.profit { color: #002FA7; }
  #detail .basis { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #bbb; margin-left: 4px; }
  #detail .pct { color: inherit; opacity: .8; }

  #detail .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  #detail .oneliner {
    margin: 0;
    color: #666;
    font-style: italic;
    line-height: 1.4;
  }

  #modes {
    position: absolute;
    top: 2.5vw;
    right: 2.5vw;
    z-index: 3;
  }

  #modes {
    display: flex;
    align-items: center;
  }

  #period {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    letter-spacing: .15em;
    color: #323232;
    margin-right: 14px;
  }

  #status {
    position: absolute;
    top: calc(2.5vw + 36px);
    right: 2.5vw;
    font-size: 11px;
    color: #999;
    text-align: right;
  }

  #status.error {
    color: #E4572E;
    font-size: 13px;
  }

  #modes button {
    font-family: 'Inconsolata', monospace;
    font-size: 12px;
    letter-spacing: .1em;
    padding: 6px 14px;
    border: 1px solid #323232;
    background: #fff;
    color: #323232;
    cursor: pointer;
  }

  #modes button + button {
    border-left: none;
  }

  #modes button.active {
    background: #323232;
    color: #fff;
  }

  @media (max-width: 700px) {
    #sidebar { width: 60%; top: calc(2.5vw + 56px); }
    #title { font-size: 1.8em; }
    #legend { width: calc(100% - 5vw); }
  }

  #legend {
    position: absolute;
    bottom: 2.5vw;
    left: 2.5vw;
    width: 25%;
    text-align: left;
    line-height: 14px;
    color: #666;
    z-index: 2;
  }

  /* Tight legend lines, nothing under the last one, so its bottom sits on the grid */
  #legend h5 {
    margin: 0 0 4px;
  }

  #legend h5:last-child {
    margin-bottom: 0;
  }
  /* Exactly one screen: no scroll bars */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #pie {
    display: block;   /* inline SVGs add a few pixels below themselves */
  }

  /* 12-point grid, as on exp.is: 4 columns x 3 rows of short dashes,
     the two centre dashes omitted. Black on white, never clickable. */
  #grid12 {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none;
    z-index: 10;
  }

  #grid12 i {
    position: absolute;
    width: 2.5vw;
    height: 1px;
    background: rgba(0, 0, 0, .9);
    left: calc((100% - 2.5vw) * var(--c) / 3);
    top: calc(2.5vw + (100% - 5vw - 1px) * var(--r) / 2);
  }
</style>
</head>
<body>
<script type="text/javascript" src="js/base.js"></script>
<script type="text/javascript" src="js/DataStructures.Tree.customized.js"></script>
<script type="text/javascript" src="https://d3js.org/d3.v4.min.js"></script>
<script type="text/javascript" src="https://d3js.org/d3-scale-chromatic.v0.3.min.js"></script>
<script type="text/javascript" src="js/sundial.js"></script>

  <div id='sidebar'>
    <div id='info' style='visibility: hidden;'>
      <h3 id='title'></h3>
      <p id='detail'></p>
    </div>
  </div>
  <div id='grid12' aria-hidden='true'>
    <i style='--c:0;--r:0'></i><i style='--c:1;--r:0'></i><i style='--c:2;--r:0'></i><i style='--c:3;--r:0'></i><i style='--c:0;--r:1'></i><i style='--c:3;--r:1'></i><i style='--c:0;--r:2'></i><i style='--c:1;--r:2'></i><i style='--c:2;--r:2'></i><i style='--c:3;--r:2'></i>
  </div>
  <div id='modes'>
    <span id='period'></span>
    <button data-mode='budget'>BUDGET</button><button data-mode='revenue'>REVENUE</button>
  </div>
  <div id='status'>Loading…</div>
  <div id='legend'>
    <h5><span style='color: #9E9EFE'>idea</span> | pre-budget</h5>
    <h5><span style='color: #F2ACA4'>developing</span> | pre-revenue / public-awareness</h5>
    <h5><span style='color: #323232'>operating</span> | lead-magnet / revenue-stream</h5>
    <h5><span style='color: #002FA7'>cashflow+</span> | actual revenue exceeds actual cost (automatic)</h5>
    <h5>outer band | actual vs target, <span style='color: #E4572E'>red</span> = over budget, <span style='color: #E0B000'>gold</span> = above revenue target</h5>
  </div>
</body>
</html>
